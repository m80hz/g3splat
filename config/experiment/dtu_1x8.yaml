# @package _global_

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: noposplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips]

wandb:
  name: dtu
  tags: [dtu, 256x256]

model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: './pretrained_weights/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth'
  decoder:
    make_scale_invariant: true
    depth_ratio: 0
# depth_ratio 0 for mean (expected) depth
# depth_ratio 1 for median depth, 0 works for most cases

dataset:
  re10k:
    roots: [datasets/dtu]
    original_image_shape: [512, 640]
    make_baseline_1: true
    baseline_min: 1e-3
    baseline_max: 1e2
    max_fov: 120.0
    skip_bad_shape: false


optimizer:
  lr: 5e-5
  warm_up_steps: 4000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 8

trainer:
  max_steps: 300_001
  val_check_interval: 2000

checkpointing:
  # every_n_train_steps: 150_000
  every_n_train_steps: 20_000
  save_top_k: 5
